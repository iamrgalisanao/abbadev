server {
    listen 80;
    listen [::]:80;
    server_name abbadev.com www.abbadev.com;

    root /var/www/abbadev/dist;
    index index.html;

    # Retired pages: permanent redirects. Keep in sync with routeRedirects in
    # src/App.jsx (Apache gets the same rules from public/.htaccess).
    location ~ ^/(contact|consulting-intake)/?$ {
        return 301 /#contact;
    }
    location ~ ^/(insights|workflow-demos|implementation-notes|work)/?$ {
        return 301 /cases$is_args$args;
    }
    location ~ ^/insights/system-design/?$ {
        return 301 /services/software-architecture$is_args$args;
    }
    location ~ ^/insights/ai-operations/?$ {
        return 301 /services/ai-automation$is_args$args;
    }
    location ~ ^/insights/digital-transformation/?$ {
        return 301 /services/technical-advisory$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}
