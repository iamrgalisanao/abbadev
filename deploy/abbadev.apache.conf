<VirtualHost *:80>
    ServerName abbadev.com
    ServerAlias www.abbadev.com

    DocumentRoot /var/www/abbadev/dist

    <Directory /var/www/abbadev/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8787/api/
    ProxyPassReverse /api/ http://127.0.0.1:8787/api/

    ErrorLog ${APACHE_LOG_DIR}/abbadev-error.log
    CustomLog ${APACHE_LOG_DIR}/abbadev-access.log combined
</VirtualHost>
